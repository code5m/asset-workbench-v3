name: CI

on:
  push:
    branches:
      - main
      - fix/**
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Use Java 21 semantic compiler
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use Python SQL parser
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install audited SQL parsing dependency
        run: python -m pip install --require-hashes -r tools/semantic/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Verify
        env:
          CI: '1'
        run: npm run check
